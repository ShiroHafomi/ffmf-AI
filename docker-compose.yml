# FFMS local stack: MySQL + AI (FastAPI) + API (Node) + Web (Next.js)
#
# NOTE: the application schema (users, households, expenses, budgets, ...) is not
# committed to this repo. The migrations in ./backend/db/migrations are
# idempotent normalizations that assume those tables already exist. Load the
# base schema into MySQL before first run (or point DB_HOST at your existing DB).

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ffms
      MYSQL_ROOT_PASSWORD: ffms_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pffms_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ffms_dev_password
      DB_NAME: ffms
      CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ffms_dev_password
      DB_NAME: ffms
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      AI_SERVICE_URL: http://ai:8000
      FRONTEND_ORIGIN: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_started

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql_data:
